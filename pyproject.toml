[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "litsurvey"
version = "1.0.0"
description = "Multi-source scientific literature search with optional LLM-driven novelty assessment and deep research. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Uday K Khankhoje", email = "uday@ee.iitm.ac.in"}]
keywords = ["literature search", "semantic scholar", "openalex", "arxiv", "peer review", "systematic review", "bibtex", "llm", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/udaykdk/litsurvey"
Issues = "https://github.com/udaykdk/litsurvey/issues"
Changelog = "https://github.com/udaykdk/litsurvey/blob/main/CHANGELOG.md"

[project.scripts]
litsurvey = "litsurvey.cli:main"

[tool.setuptools.packages.find]
include = ["litsurvey*"]

[tool.setuptools.package-data]
litsurvey = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
